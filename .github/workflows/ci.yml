name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Frontend build (vite)
        run: npm run build

  rust:
    name: Rust (tests + clippy)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frontend (for tauri context)
        run: |
          npm ci
          npm run build

      - name: Headless-sim unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features headless-sim

      - name: Windows unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy lint check
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
